name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Présence du workspace Rust
        id: has
        run: echo "rust=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Dépendances système (Tauri)
        if: steps.has.outputs.rust == 'true' && hashFiles('src-tauri/Cargo.toml') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Toolchain
        if: steps.has.outputs.rust == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.has.outputs.rust == 'true'
      - name: Format
        if: steps.has.outputs.rust == 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: steps.has.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        if: steps.has.outputs.rust == 'true'
        run: cargo test --workspace --all-features
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        if: steps.has.outputs.rust == 'true' && hashFiles('crates/torgas-wasm/Cargo.toml') != ''
        with:
          version: v0.15.1
      - name: Build WebAssembly
        if: steps.has.outputs.rust == 'true' && hashFiles('crates/torgas-wasm/Cargo.toml') != ''
        run: wasm-pack build crates/torgas-wasm --target web --release

  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Présence de l'app
        id: has
        run: echo "app=$([ -f app/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.has.outputs.app == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has.outputs.app == 'true'
        with:
          node-version: 24
          cache: pnpm
      # L'app consomme `crates/torgas-wasm/pkg` (dépendance `link:`) : construit avant l'installation.
      - name: Toolchain Rust
        if: steps.has.outputs.app == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.has.outputs.app == 'true'
        with:
          key: wasm
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        if: steps.has.outputs.app == 'true'
        with:
          version: v0.15.1
      - name: Build WebAssembly
        if: steps.has.outputs.app == 'true'
        run: wasm-pack build crates/torgas-wasm --target web --release
      - name: Installation
        if: steps.has.outputs.app == 'true'
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.has.outputs.app == 'true'
        run: pnpm lint
      - name: Typecheck
        if: steps.has.outputs.app == 'true'
        run: pnpm typecheck
      - name: Tests
        if: steps.has.outputs.app == 'true'
        run: pnpm test
      - name: Build web
        if: steps.has.outputs.app == 'true'
        run: pnpm generate

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: v0.15.1
      - name: Build WebAssembly
        run: wasm-pack build crates/torgas-wasm --target web --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torgas-wasm-pkg
          path: crates/torgas-wasm/pkg/
          retention-days: 1

  e2e:
    name: E2E
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Image officielle : navigateurs et dépendances système déjà installés (version = @playwright/test).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: torgas-wasm-pkg
          path: crates/torgas-wasm/pkg/
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Installation
        run: pnpm install --frozen-lockfile
      - name: Tests de bout en bout
        run: pnpm test:e2e
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
