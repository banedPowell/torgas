name: Titre de PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            ci
            build
            style
            revert
          scopes: |
            app
            core
            wasm
            tauri
            reader
            library
            import
            theme
            ci
            deps
            docs
          requireScope: false
          subjectPattern: ^[a-zà-ÿ].+$
          subjectPatternError: Le sujet doit commencer par une minuscule.
