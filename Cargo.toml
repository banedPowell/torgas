[workspace]
resolver = "3"
# `src-tauri` rejoindra le workspace à l'étape 9 du plan.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/banedPowell/torgas"
publish = false

[workspace.dependencies]
torgas-core = { path = "crates/torgas-core" }

thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
zip = { version = "9.7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rusqlite = { version = "0.43", features = ["bundled"] }
uuid = { version = "1.29", features = ["v7"] }
ts-rs = "12.0"

wasm-bindgen = "0.2.100"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
