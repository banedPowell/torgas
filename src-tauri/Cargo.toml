[package]
name = "torgas-desktop"
description = "Coquille desktop Tauri 2 de Torgas : commandes du cœur et protocole torgas://."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "torgas-desktop"

[lib]
name = "torgas_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
torgas-core = { workspace = true, features = ["sqlite"] }
tauri = { version = "2.12", features = [] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
lru = "0.19"

[dev-dependencies]
tempfile = "3.27"
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
image.workspace = true

[lints]
workspace = true
